spring.application.name=WattWise_backend

# postgresql connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wattwise}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# jpa settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# personalised messages
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# jwt config
app.jwt.secret=${APP_JWT_SECRET:WattWiseSuperSecretKeyForJWTAuth2026SecureMinimum32Chars!}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
