# WattWise notification + SMTP configuration (secrets via env / .env)
wattwise:
  notifications:
    enabled: ${WATTWISE_NOTIFICATIONS_ENABLED:true}
    email:
      from: ${WATTWISE_MAIL_FROM:${SPRING_MAIL_USERNAME:}}
    telegram:
      bot-token: ${TELEGRAM_BOT_TOKEN:}
      api-base-url: ${TELEGRAM_API_BASE_URL:https://api.telegram.org}
    webhook:
      url: ${NOTIFICATION_WEBHOOK_URL:}
      auth-header: ${NOTIFICATION_WEBHOOK_AUTH:}

spring:
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS:true}
